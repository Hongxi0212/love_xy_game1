<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数字炸弹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c28;
  --border: rgba(255,255,255,0.08);
  --border-bright: rgba(255,255,255,0.18);
  --accent: #e8ff47;
  --accent-dim: rgba(232,255,71,0.12);
  --accent-glow: rgba(232,255,71,0.25);
  --red: #ff4d6d;
  --red-dim: rgba(255,77,109,0.12);
  --blue: #47b8ff;
  --blue-dim: rgba(71,184,255,0.12);
  --green: #47ffb8;
  --green-dim: rgba(71,255,184,0.12);
  --text: #f0f0f8;
  --text2: rgba(240,240,248,0.55);
  --text3: rgba(240,240,248,0.3);
  --mono: 'Space Mono', monospace;
  --sans: 'Noto Sans SC', sans-serif;
  --r: 10px;
  --r-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(232,255,71,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 90%, rgba(71,184,255,0.04) 0%, transparent 60%);
}

#app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  padding: 0;
}

/* ── Setup screen ─────────────────────────────── */
.setup-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 2rem 1.25rem 2rem;
  gap: 1.5rem;
}

.setup-hero {
  text-align: center;
  padding: 1.5rem 0 0.5rem;
}

.bomb-icon {
  font-size: 3rem;
  display: block;
  margin-bottom: 0.75rem;
  animation: pulse-bomb 2.4s ease-in-out infinite;
}

@keyframes pulse-bomb {
  0%,100% { transform: scale(1) rotate(-3deg); }
  50% { transform: scale(1.08) rotate(3deg); }
}

.setup-title {
  font-family: var(--mono);
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent);
  text-shadow: 0 0 32px var(--accent-glow);
}

.setup-sub {
  font-size: 0.82rem;
  color: var(--text2);
  margin-top: 0.4rem;
  line-height: 1.6;
}

.section-label {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 0.5rem;
}

.secret-input-wrap {
  display: flex;
  gap: 8px;
  justify-content: center;
  width: 100%;
}

.digit-input {
  flex: 1;
  min-width: 0;
  max-width: 72px;
  height: 68px;
  background: var(--surface);
  border: 1px solid var(--border-bright);
  border-radius: var(--r);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 2rem;
  font-weight: 700;
  text-align: center;
  outline: none;
  caret-color: var(--accent);
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  -webkit-appearance: none;
}

.digit-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim), inset 0 0 12px var(--accent-dim);
  background: rgba(232,255,71,0.04);
}

.hidden-master {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 1px;
  height: 1px;
}

.start-btn {
  width: 100%;
  height: 56px;
  background: var(--accent);
  border: none;
  border-radius: var(--r);
  color: #0a0a0f;
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.12s, box-shadow 0.15s;
}

.start-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.start-btn:hover { box-shadow: 0 0 24px var(--accent-glow); }
.start-btn:active { transform: scale(0.97); }
.start-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.algo-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 1rem 1.1rem;
  font-size: 0.8rem;
  color: var(--text2);
  line-height: 1.7;
}

.algo-card-title {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.05em;
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.65rem;
  padding: 1px 7px;
  border-radius: 20px;
  border: 1px solid;
  font-weight: 400;
}
.tag-accent { color: var(--accent); border-color: rgba(232,255,71,0.3); background: var(--accent-dim); }
.tag-red    { color: var(--red);    border-color: rgba(255,77,109,0.3);  background: var(--red-dim); }
.tag-blue   { color: var(--blue);   border-color: rgba(71,184,255,0.3);  background: var(--blue-dim); }
.tag-green  { color: var(--green);  border-color: rgba(71,255,184,0.3);  background: var(--green-dim); }

/* ── Game screen ──────────────────────────────── */
.game-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.1rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 10;
  gap: 8px;
}

.game-title {
  font-family: var(--mono);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
}

.status-badge {
  font-size: 0.72rem;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 20px;
  white-space: nowrap;
}

.badges-row {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}

/* Secret panels */
.secrets-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 10px 10px 0;
}

.secret-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 12px;
}

.secret-panel-label {
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 7px;
}

.digit-row {
  display: flex;
  gap: 5px;
}

.digit-box {
  flex: 1;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-bright);
  background: var(--surface2);
  color: var(--text);
  transition: all 0.2s;
}

.digit-box.muted {
  color: var(--text3);
  border-color: var(--border);
}

.digit-box.accent { color: var(--accent); border-color: rgba(232,255,71,0.25); }

.pool-info {
  font-size: 0.65rem;
  color: var(--text3);
  margin-top: 5px;
  font-family: var(--mono);
}

.pool-bar-wrap {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}

.pool-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* History */
.history-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  -webkit-overflow-scrolling: touch;
}

.history-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 0.8rem;
  text-align: center;
  padding: 2rem;
  line-height: 1.6;
}

.history-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  animation: row-in 0.2s ease;
}

@keyframes row-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.history-row.player-row {
  border-color: rgba(71,184,255,0.2);
  background: rgba(71,184,255,0.04);
}

.history-row.ai-row {
  border-color: rgba(255,77,109,0.15);
  background: rgba(255,77,109,0.03);
}

.round-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text3);
  min-width: 22px;
  text-align: right;
}

.who-tag {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
  letter-spacing: 0.04em;
}

.who-p { background: var(--blue-dim); color: var(--blue); }
.who-a { background: var(--red-dim);  color: var(--red); }

.guess-digits {
  display: flex;
  gap: 3px;
  flex: 1;
}

.guess-digit {
  width: 26px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 0.9rem;
  font-weight: 700;
  border-radius: 4px;
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  color: var(--text);
}

.hits-display {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.hit-pip {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  transition: all 0.3s;
}

.hit-count-label {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text2);
  min-width: 22px;
}

.left-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text3);
  flex-shrink: 0;
  min-width: 36px;
  text-align: right;
}

/* Thinking row */
.thinking-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  background: var(--red-dim);
  border: 1px solid rgba(255,77,109,0.15);
  font-size: 0.75rem;
  color: var(--red);
  font-family: var(--mono);
}

.thinking-dots {
  display: flex; gap: 3px;
}
.thinking-dots span {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--red);
  animation: dot-bounce 1.2s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dot-bounce {
  0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* Input area */
.input-area {
  padding: 10px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  width: 100%;
  overflow: hidden;
}

.input-row {
  display: flex;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.guess-input-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 4px;
}

.guess-digit-input {
  flex: 1;
  min-width: 0;
  width: 0;
  height: 48px;
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: var(--r-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 1.25rem;
  font-weight: 700;
  text-align: center;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}

.guess-digit-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px rgba(71,184,255,0.15);
}

.guess-btn {
  height: 48px;
  padding: 0 14px;
  background: var(--accent);
  border: none;
  border-radius: var(--r-sm);
  color: #0a0a0f;
  font-family: var(--mono);
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
  transition: transform 0.1s, box-shadow 0.15s;
  letter-spacing: 0.04em;
}
.guess-btn:hover { box-shadow: 0 0 16px var(--accent-glow); }
.guess-btn:active { transform: scale(0.96); }

/* Over screen */
.over-banner {
  margin: 10px;
  padding: 1rem 1.2rem;
  border-radius: var(--r);
  text-align: center;
}

.over-banner.win {
  background: var(--green-dim);
  border: 1px solid rgba(71,255,184,0.2);
}
.over-banner.lose {
  background: var(--red-dim);
  border: 1px solid rgba(255,77,109,0.2);
}

.over-title {
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.over-title.win  { color: var(--green); }
.over-title.lose { color: var(--red); }

.over-sub {
  font-size: 0.8rem;
  color: var(--text2);
  margin-bottom: 12px;
  line-height: 1.5;
}

.replay-btn {
  height: 44px;
  padding: 0 24px;
  background: transparent;
  border: 1px solid var(--border-bright);
  border-radius: var(--r-sm);
  color: var(--text);
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  letter-spacing: 0.04em;
}
.replay-btn:hover { background: var(--surface2); border-color: var(--border-bright); }

/* revealed secret */
.secret-panel.revealed .digit-box {
  color: var(--accent);
  border-color: rgba(232,255,71,0.3);
  box-shadow: inset 0 0 8px var(--accent-dim);
  animation: reveal-pop 0.35s ease;
}
@keyframes reveal-pop {
  0%   { transform: scale(0.85); opacity: 0; }
  60%  { transform: scale(1.08); }
  100% { transform: scale(1);   opacity: 1; }
}

/* ── Mobile safe area ─────────────────────────── */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  .input-area { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
}

/* ── Scrollbar ────────────────────────────────── */
.history-scroll::-webkit-scrollbar { width: 3px; }
.history-scroll::-webkit-scrollbar-track { background: transparent; }
.history-scroll::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ALL = Array.from({length:10000},(_,i)=>i.toString().padStart(4,'0'));

function hits(a,b){let n=0;for(let i=0;i<4;i++)if(a[i]===b[i])n++;return n;}
function narrow(pool,g,n){return pool.filter(c=>hits(g,c)===n);}
function pickBest(pool){
  if(!pool||pool.length<=1)return pool?.[0]??null;
  let ev=pool;
  if(pool.length<=60)ev=ALL;
  else if(pool.length>1200){
    const s=[...pool];for(let i=s.length-1;i>0;i--){const j=0|Math.random()*(i+1);[s[i],s[j]]=[s[j],s[i]];}ev=s.slice(0,600);
  }
  const inP=new Set(pool);let bst=pool[0],bW=Infinity;
  for(const g of ev){const b=[0,0,0,0,0];for(const c of pool)b[hits(g,c)]++;const w=Math.max(...b);if(w<bW||(w===bW&&inP.has(g)&&!inP.has(bst))){bW=w;bst=g;}}
  return bst;
}
function rand4(){return(0|Math.random()*10000).toString().padStart(4,'0');}

let state={
  phase:'setup', pSecret:'', aSecret:'', pool:ALL,
  history:[], turn:'p', winner:null, thinking:false,
  aiMoves:0, digits:['','','','']
};
let aiTimer=null;

// ── Render helpers ─────────────────────────────

function digitBoxes(str, muted, revealed){
  return str.split('').map(d=>{
    const cls = muted ? 'muted' : revealed ? 'accent' : '';
    return `<div class="digit-box ${cls}">${d}</div>`;
  }).join('');
}

function guessDigits(str){
  return str.split('').map(d=>`<div class="guess-digit">${d}</div>`).join('');
}

function hitPips(n){
  const colors = ['var(--border-bright)','var(--border-bright)','var(--border-bright)','var(--border-bright)'];
  for(let i=0;i<n;i++){
    colors[i] = n===4 ? 'var(--green)' : n>=2 ? 'var(--accent)' : 'var(--blue)';
  }
  const pips = colors.map(c=>`<div class="hit-pip" style="background:${c}"></div>`).join('');
  return `<div class="hits-display">${pips}<span class="hit-count-label">${n}位</span></div>`;
}

// ── Setup screen ───────────────────────────────

function renderSetup(){
  const filled = state.digits.every(d=>d!=='');
  return `
<div class="setup-wrap">
  <div class="setup-hero">
    <span class="bomb-icon">💣</span>
    <div class="setup-title">数字炸弹</div>
    <div class="setup-sub">双方各持一个四位密码<br>轮流猜测，位置与数字均需正确才算命中</div>
  </div>

  <div>
    <div class="section-label">设置你的四位密码</div>
    <div class="secret-input-wrap" id="digit-inputs">
      ${[0,1,2,3].map(i=>`
        <input class="digit-input" id="di${i}" type="tel" inputmode="numeric"
          maxlength="1" value="${state.digits[i]}"
          autocomplete="off" data-idx="${i}" />
      `).join('')}
    </div>
  </div>

  <button class="start-btn" id="go-btn" ${filled?'':'disabled'}>开始对决</button>

  <div class="algo-card">
    <div class="algo-card-title">
      <span>算法说明</span>
      <span class="tag tag-accent">Minimax</span>
    </div>
    AI维护所有候选数字的可能集合，每次选择在最坏情况下能<strong>将候选集缩减最多</strong>的猜测。首轮固定猜
    <span style="font-family:var(--mono);color:var(--accent)">1234</span>，
    理论上最多 <strong>7轮</strong> 内必能破解任意四位密码。
  </div>
</div>`;
}

function bindSetup(){
  const inputs = [0,1,2,3].map(i=>document.getElementById(`di${i}`));
  inputs.forEach((inp,i)=>{
    inp.addEventListener('input', e=>{
      const v = e.target.value.replace(/\D/g,'').slice(-1);
      state.digits[i] = v;
      inp.value = v;
      document.getElementById('go-btn').disabled = !state.digits.every(d=>d!=='');
      if(v && i<3) inputs[i+1].focus();
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Backspace' && !state.digits[i] && i>0){
        inputs[i-1].focus();
        inputs[i-1].select();
      }
      if(e.key==='Enter' && state.digits.every(d=>d!=='')) startGame();
    });
  });
  document.getElementById('go-btn').addEventListener('click', startGame);
}

// ── Game screen ────────────────────────────────

function renderGame(){
  const over = state.phase==='over';
  const pG = state.history.filter(h=>h.who==='p').length;
  const aG = state.history.filter(h=>h.who==='a').length;

  // Status badge
  let badgeHTML='';
  if(over){
    const cls = state.winner==='p' ? 'tag tag-green' : 'tag tag-red';
    const txt = state.winner==='p' ? `胜利 ${pG}次` : `失败 ${aG}次`;
    badgeHTML=`<span class="${cls}" style="font-family:var(--mono);font-size:0.68rem">${txt}</span>`;
  } else {
    const isP = state.turn==='p' && !state.thinking;
    badgeHTML=`
      <span class="tag ${isP?'tag-blue':'tag-red'}" style="font-family:var(--mono);font-size:0.68rem">
        ${state.thinking ? '计算中…' : isP ? '你的回合' : 'AI回合'}
      </span>`;
  }

  // History rows
  let histHTML='';
  if(state.history.length===0){
    histHTML=`<div class="history-empty">输入你的第一次猜测<br>开始对决</div>`;
  } else {
    state.history.forEach((e,i)=>{
      const rn = Math.floor(i/2)+1;
      const isP = e.who==='p';
      const rLabel = i%2===0 ? `<span class="round-label">R${rn}</span>` : `<span class="round-label"></span>`;
      const whoTag = isP
        ? `<span class="who-tag who-p">你</span>`
        : `<span class="who-tag who-a">AI</span>`;
      const rem = (!isP && e.left!==undefined)
        ? `<span class="left-label">剩${e.left}</span>` : `<span class="left-label"></span>`;
      histHTML+=`<div class="history-row ${isP?'player-row':'ai-row'}">
        ${rLabel}${whoTag}
        <div class="guess-digits">${guessDigits(e.guess)}</div>
        ${hitPips(e.resp)}
        ${rem}
      </div>`;
    });
    if(state.thinking){
      histHTML+=`<div class="thinking-row">
        <div class="thinking-dots"><span></span><span></span><span></span></div>
        AI正在计算最优猜测…
      </div>`;
    }
  }

  // Pool bar
  const pct = Math.round(state.pool.length/10000*100);

  // Bottom area
  let bottomHTML='';
  if(over){
    const win = state.winner==='p';
    bottomHTML=`<div class="over-banner ${win?'win':'lose'}">
      <div class="over-title ${win?'win':'lose'}">${win?'🎉 破解成功':'💥 炸弹引爆'}</div>
      <div class="over-sub">${win
        ? `你用 ${pG} 次猜中了 AI 的密码<br>AI 猜了你 ${aG} 次`
        : `AI 仅用 ${aG} 次就破解了你的密码<br>你猜了 ${pG} 次`}</div>
      <button class="replay-btn" id="again-btn">再来一局</button>
    </div>`;
  } else if(state.turn==='p'&&!state.thinking){
    bottomHTML=`<div class="input-area">
      <div class="input-row">
        <div class="guess-input-wrap" id="guess-inputs">
          ${[0,1,2,3].map(j=>`<input class="guess-digit-input" id="gi${j}" type="tel" inputmode="numeric" maxlength="1" autocomplete="off" data-idx="${j}" />`).join('')}
        </div>
        <button class="guess-btn" id="guess-btn">猜！</button>
      </div>
    </div>`;
  } else {
    bottomHTML=`<div class="input-area" style="text-align:center;color:var(--text2);font-size:0.8rem;font-family:var(--mono);padding:16px 10px">AI 正在分析…</div>`;
  }

  const aiSecret = over ? state.aSecret : '????';
  const aiMuted  = !over;

  return `
<div class="game-wrap">
  <div class="game-header">
    <span class="game-title">💣 数字炸弹</span>
    <div class="badges-row">${badgeHTML}</div>
  </div>

  <div class="secrets-row">
    <div class="secret-panel">
      <div class="secret-panel-label">你的密码</div>
      <div class="digit-row">${digitBoxes(state.pSecret, false, false)}</div>
    </div>
    <div class="secret-panel ${over?'revealed':''}">
      <div class="secret-panel-label">AI 的密码${over?' (已揭晓)':''}</div>
      <div class="digit-row">${digitBoxes(aiSecret, aiMuted, over)}</div>
      ${!over?`<div class="pool-info">候选剩余 ${state.pool.length.toLocaleString()} 个</div>
      <div class="pool-bar-wrap"><div class="pool-bar" style="width:${pct}%"></div></div>`:''}
    </div>
  </div>

  <div class="history-scroll" id="hist">${histHTML}</div>
  ${bottomHTML}
</div>`;
}

function bindGame(){
  const over = state.phase==='over';

  if(over){
    document.getElementById('again-btn')?.addEventListener('click',()=>{
      state={...state,phase:'setup',digits:['','','',''],history:[],pool:ALL};
      render();
    });
    return;
  }

  if(state.turn==='p'&&!state.thinking){
    const ginputs=[0,1,2,3].map(j=>document.getElementById(`gi${j}`));
    let guessArr=['','','',''];
    ginputs.forEach((inp,j)=>{
      inp.addEventListener('input',e=>{
        const v=e.target.value.replace(/\D/g,'').slice(-1);
        guessArr[j]=v;
        inp.value=v;
        if(v&&j<3)ginputs[j+1].focus();
      });
      inp.addEventListener('keydown',e=>{
        if(e.key==='Backspace'&&!guessArr[j]&&j>0){
          ginputs[j-1].focus();
          ginputs[j-1].select();
        }
        if(e.key==='Enter') trySubmit();
      });
    });
    document.getElementById('guess-btn').addEventListener('click', trySubmit);
    ginputs[0]?.focus();

    function trySubmit(){
      const g=guessArr.join('');
      if(!/^\d{4}$/.test(g))return;
      submitGuess(g);
    }
  }

  // Scroll hist to bottom
  const h=document.getElementById('hist');
  if(h) requestAnimationFrame(()=>{ h.scrollTop=h.scrollHeight; });
}

// ── Game logic ─────────────────────────────────

function startGame(){
  const secret=state.digits.join('');
  if(!/^\d{4}$/.test(secret))return;
  const ai=rand4();
  clearTimeout(aiTimer);
  state={
    phase:'play', pSecret:secret, aSecret:ai,
    pool:ALL, history:[], turn:'p', winner:null,
    thinking:false, aiMoves:0, digits:state.digits
  };
  render();
}

function submitGuess(g){
  const r=hits(g,state.aSecret);
  const e={who:'p',guess:g,resp:r};
  const newH=[...state.history,e];
  if(r===4){state={...state,history:newH,winner:'p',phase:'over'};render();return;}
  state={...state,history:newH,turn:'a',thinking:true};
  render();
  scheduleAI();
}

function scheduleAI(){
  clearTimeout(aiTimer);
  aiTimer=setTimeout(()=>{
    const pool=state.pool;
    const g=state.aiMoves===0?'1234':(pickBest(pool)??pool[0]);
    const r=hits(g,state.pSecret);
    const np=narrow(pool,g,r);
    const e={who:'a',guess:g,resp:r,left:np.length};
    const newH=[...state.history,e];
    if(r===4){state={...state,history:newH,pool:np,aiMoves:state.aiMoves+1,thinking:false,winner:'a',phase:'over'};render();return;}
    state={...state,history:newH,pool:np,aiMoves:state.aiMoves+1,thinking:false,turn:'p'};
    render();
  }, 700+Math.random()*500);
}

// ── Render ─────────────────────────────────────

function render(){
  const app=document.getElementById('app');
  app.style.display='flex';
  app.style.flexDirection='column';
  app.style.minHeight='100dvh';

  if(state.phase==='setup'){
    app.innerHTML=renderSetup();
    bindSetup();
  } else {
    app.innerHTML=renderGame();
    bindGame();
  }
}

render();
</script>
</body>
</html>
